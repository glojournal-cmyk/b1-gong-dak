name: Publish B1 learning preview (no paid AI)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/b1-learning-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: b1-learning-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static preview only
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
