name: Build Android offline APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-debug-apk.yml"]
permissions:
  contents: read
  issues: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Post diagnostics run URL to issue 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body "Android build run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (commit ${GITHUB_SHA})"
      - name: Check out source
        uses: actions/checkout@v4
      - name: Java 21 for LiteRT-LM
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build environment diagnostics
        run: |
          echo "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          find android -maxdepth 2 -name '*.gradle.kts' -print
      - name: Build debug APK (capture detailed errors)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee ../android-build-log.txt
      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: b1-android-build-diagnostics
          path: android-build-log.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: b1-gong-dak-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
